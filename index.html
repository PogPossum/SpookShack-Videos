<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpookShack Videos</title>
    <link rel="icon" href="/ardnscr-logo.ico">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container"> 
        <h1 class="neonText">SpookShack </h1>
        <h1 class="neonText">Videos</1>
    </div>

    <main>
        <nav id="SiteNav">
        <ul>
            <li><a href="#" onclick="filterByGroup('GenreName')">Genres</a></li>
            <li><a href="#" onclick="filterByGroup('MovieMonster')">Monsters</a></li>
            <li><a href="#" onclick="filterByGroup('Director')">Directors</a></li>
        </ul>
    </nav>

    <main>
        <h2>You want horror? We got horror.</h2>
        
        <!-- Search and Filter Controls -->
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Search..." oninput="handleSearch()">
            <button id="clearBtn" onclick="resetView()" style="display:none;">Show All Movies</button>
        </div>

        <div id="movieDisplay">
            <p class="loading">Waking up the database...</p>
        </div>

        <div class="movie-card">
            <div class="poster-wrapper">
                <img src="posters/${Movies.MovieID}.jpg" onerror="this.src='posters/vhs-placeholder.png';" alt="${Movies.Title} Poster" class="movie-poster">
            </div>
            <div class="movie-info">
                <h3>${Movies.Title}</h3>
                <div class="movie-details">
                    <p><strong>Released:</strong> ${Movies.Release}</p>
                    <p><strong>Director:</strong> ${Movies.Director}</p>
                    <p><strong>Genre:</strong> ${MovieGenres.GenreName}</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        let allMovies = [];

        // 1. Fetch movies when the page loads
        async function fetchMovies() {
            try {
                const response = await fetch('/api/movies');
                const result = await response.json();
                
                if (result.status === "SUCCESS") {
                    allMovies = result.data;
                    displayStandardGrid(allMovies);
                } else {
                    document.getElementById('movieDisplay').innerHTML = `<p style="color:var(--accent--color)">Error loading collection.</p>`;
                }
            } catch (error) {
                console.error("Failed to fetch movies:", error);
                document.getElementById('movieDisplay').innerHTML = `<p style="color:var(--accent--color)">Could not connect to backend.</p>`;
            }
        }

        // 2. Render Standard Main Grid View
        function displayStandardGrid(moviesList) {
            const display = document.getElementById('movieDisplay');
            if (moviesList.length === 0) {
                display.innerHTML = `<p>No matching horror relics found.</p>`;
                return;
            }

            let html = '<div class="movie-grid">';
            moviesList.forEach(movie => {
                html += `
                    <div class="movie-card">
                        <h3>${Movies.Title}</h3>
                        <div class="movie-details">
                            <p><strong>Released:</strong> ${Movies.Release}</p>
                            <p><strong>Director:</strong> ${Movies.Director}</p>
                            <p><strong>Monster/Threat:</strong> ${Movies.MovieMonster}</p>
                            <p><strong>Genre:</strong> ${MovieGenres.GenreName}</p>
                            <span class="badge">${Movies.CreatureFeature === 'Y' ? '🧬 Creature Feature' : '🎬 Standard'}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            display.innerHTML = html;
        }

        // 3. Search Filter Logic
        function handleSearch() {
            const searchVal = document.getElementById('movieSearch').value.toLowerCase();
            const filtered = allMovies.filter(movie => {
                return Movies.Title.toLowerCase().includes(searchVal) || 
                       Movies.Director.toLowerCase().includes(searchVal) ||
                       Movies.MovieMonster.toLowerCase().includes(searchVal) ||
                       MovieGenres.GenreName.toLowerCase().includes(searchVal);
            });
            displayStandardGrid(filtered);
        }

        // 4. Categorized View
        function filterByGroup(property) {
            document.getElementById('clearBtn').style.display = 'inline-block';
            const display = document.getElementById('movieDisplay');
            
            // Group our array items by whatever column property was clicked
            const grouped = {};
            allMovies.forEach(movie => {
                const key = movie[property] || "Unknown";
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(movie);
            });

            // Build out a clean categorized shelf view
            let html = '<div class="category-view">';
            for (const [categoryName, movies] of Object.entries(grouped)) {
                html += `<div class="category-block">
                    <h2 class="category-title">${categoryName}</h2>
                    <div class="movie-grid">`;
                
                movies.forEach(movie => {
                    html += `
                        <div class="movie-card">
                            <h3>${Movies.Title}</h3>
                            <div class="movie-details">
                                <p><strong>Director:</strong> ${Movies.Director}</p>
                                <p><strong>Monster:</strong> ${Movies.MovieMonster}</p>
                                <p><strong>Genre:</strong> ${MovieGenre.GenreName}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            html += '</div>';
            display.innerHTML = html;
        }

        // 5. Reset to original frontpage list view
        function resetView() {
            document.getElementById('movieSearch').value = '';
            document.getElementById('clearBtn').style.display = 'none';
            displayStandardGrid(allMovies);
        }

        // Boot everything up
        fetchMovies();
    </script>
    </main>

</body>
</html>
